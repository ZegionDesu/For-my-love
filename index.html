<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Erlynn Sayang ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: #ffe6ea;
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            color: #d63031;
        }

        .container {
            width: 90%;
            max-width: 500px;
            min-height: 60vh; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px 20px; 
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.3);
            position: relative;
            z-index: 10;
            
            display: flex; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #step2, #step3, #step4 { display: none; }

        img.gif {
            width: 150px;
            margin-bottom: 20px; 
            border-radius: 10px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 25px; 
            line-height: 1.5;
            text-align: center;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            width: 100%;
            min-height: 50px;
            flex-wrap: wrap; 
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            background: #ff4757;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            white-space: nowrap; 
        }

        button:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }

        #btnNo {
            background: #747d8c;
            box-shadow: 0 5px 15px rgba(116, 125, 140, 0.4);
            position: relative;
            z-index: 100;
            padding: 12px 20px;
        }

        .typewriter-text {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 20px;
            color: #d63031;
            line-height: 1.5;
            text-align: center;
        }

        .fullscreen-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000; 
            z-index: 9999; 
            display: none; 
            justify-content: center;
            align-items: center;
        }
        
        .fullscreen-video video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        .heart-fall {
            position: absolute;
            top: -5vh;
            font-size: 24px;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- TAHAP 1 -->
    <div class="container" id="step1">
        <!-- Kucing Mochi Sapa -->
        <img src="https://media.tenor.com/FwF_nO7LBAwAAAAi/peach-goma.gif" alt="Kucing Lucu" class="gif">
        <h2>haiiiii cantiqqqqq, mawuuu tanyaa dunggg sayaangg 👀</h2>
        <div class="btn-group">
            <button onclick="nextStep('step1', 'step2')">Lanjut 👉</button>
        </div>
    </div>

    <!-- TAHAP 2 -->
    <div class="container" id="step2">
        <!-- Kucing Mochi Nanya -->
        <img src="https://media.tenor.com/ZJ4wU5Q7V8gAAAAi/peach-and-goma-peach-goma.gif" alt="Kucing Tanya" class="gif">
        <h2>kamuuuu sayanggg ndaaa samaaa akuuuu 👉👈🥺</h2>
        <div class="btn-group" id="run-btn-container">
            <button onclick="nextStep('step2', 'step3'); startSurprise();">siying bingit dungg</button>
            <button id="btnNo" onmouseover="lari(this)" ontouchstart="lari(this)">G</button>
        </div>
    </div>

    <!-- TAHAP 3 -->
    <div class="container" id="step3">
        <!-- Kucing Mochi Peluk -->
        <img src="https://media.tenor.com/ef305M093kMAAAAi/peach-goma.gif" alt="Kucing Love" class="gif" style="width: 180px;">
        <h2 style="margin-bottom: 5px;">Happy National Girlfriend Day,<br>Erlynn sayangggg! 🎉</h2>
        <p style="font-size: 0.9rem; color: #a4b0be; margin-bottom: 10px;">1 Agustus 2026</p>
        <div class="typewriter-text" id="typewriter"></div>
    </div>

    <!-- TAHAP 4: FULL VIDEO -->
    <div class="fullscreen-video" id="step4">
        <video id="myVideo" controls playsinline>
            <source src="media/video.mp4" type="video/mp4">
            Browser kamu tidak mendukung pemutaran video.
        </video>
    </div>

    <script>
        function nextStep(hideId, showId) {
            document.getElementById(hideId).style.display = 'none';
            document.getElementById(showId).style.display = 'flex';
        }

        function lari(btn) {
            btn.style.position = 'fixed';
            const maxX = window.innerWidth - btn.clientWidth - 20;
            const maxY = window.innerHeight - btn.clientHeight - 20;
            btn.style.left = Math.floor(Math.random() * maxX) + 'px';
            btn.style.top = Math.floor(Math.random() * maxY) + 'px';
        }

        function startSurprise() {
            createHearts();
            typeWriter();
        }

        // Teks romantis
        const text = "mueheueheh makasihhh sayanggkuu cantikkk , i loveee uuu toooo sayangg, maaafff jugaa yaa sayangg aku sering bikinn kamu kecewaaa terusss, i hopee this Will last foreverrr ♥️😍🫰🫰";
        let index = 0;
        const speed = 70; // kecepatan ngetik

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(() => {
                    nextStep('step3', 'step4');
                    
                    const videoElement = document.getElementById('myVideo');
                    videoElement.play().catch(error => {
                        console.log("Browser minta klik manual", error);
                    });
                }, 3000); 
            }
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement("div");
                heart.classList.add("heart-fall");
                heart.innerHTML = "💖";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = Math.random() * 3 + 2 + "s"; 
                heart.style.fontSize = Math.random() * 20 + 15 + "px";
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 5000);
            }, 300); 
        }
    </script>
</body>
</html>
